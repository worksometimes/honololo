name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plans and run tests
        run: npm run check

      - name: Verify shell and Python bridges
        shell: bash
        run: |
          bash -n lib/venti.sh bin/venti
          if command -v zsh >/dev/null 2>&1; then zsh -n lib/venti.sh bin/venti; fi
          python3 -m py_compile src/providers/browser-use-harness.py

      - name: Audit dependencies
        run: npm audit --audit-level=high
